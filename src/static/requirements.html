<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/assets/tab-session.js"></script>
<title>Property preferences · Staybot</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--brand:#1B3A5C;--brand-dark:#12283F;--accent:#B8873C;--ink:#15191E;--muted:#68707A;--line:#E2E5E9;--soft:#F6F7F9;--card:#fff;--good:#1F7A4D;--good-soft:#E8F5EE;--bad:#B42318;--radius:16px;--shadow:0 10px 35px rgba(15,23,42,.07);--display:"Fraunces",Georgia,serif;--sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--soft);color:var(--ink);font:14px/1.5 var(--sans);min-height:100vh}button,input,select,textarea{font:inherit}.top{max-width:1100px;margin:auto;padding:24px 22px 0;display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{display:flex;align-items:center;gap:9px;color:var(--brand);font-weight:800;font-size:22px;text-decoration:none}.brand svg{width:27px;height:27px}.logout{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-weight:600}.wrap{max-width:1100px;margin:0 auto;padding:28px 22px 60px}.hero{display:flex;justify-content:space-between;gap:28px;align-items:flex-end;margin-bottom:20px}.hero h1{font:600 clamp(28px,4vw,40px)/1.15 var(--display);margin:0 0 8px}.hero p{color:var(--muted);margin:0;max-width:700px}.badge{display:inline-flex;padding:6px 11px;border-radius:999px;background:#EAF0F6;color:var(--brand);font-weight:700;font-size:12px;margin-bottom:10px}.progress-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px 15px;min-width:230px}.progress-top{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}.bar{height:7px;border-radius:999px;background:#edf0f3;overflow:hidden}.bar i{display:block;height:100%;background:var(--brand);border-radius:inherit;width:0;transition:width .25s}.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:24px}.section{margin-top:16px}.section h2{font-size:17px;margin:0 0 4px}.section .hint{color:var(--muted);font-size:12.5px;margin:0 0 17px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.wide{grid-column:1/-1}.field{display:grid;gap:7px}.field label,.legend{font-weight:650;font-size:12.5px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 12px;outline:none;color:var(--ink)}.field textarea{min-height:92px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(27,58,92,.11)}.seg{display:flex;gap:8px;flex-wrap:wrap}.seg label{position:relative}.seg input{position:absolute;opacity:0;pointer-events:none}.seg span{display:block;border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#fff;cursor:pointer}.seg input:checked+span{border-color:var(--brand);background:#EAF0F6;color:var(--brand);font-weight:700}.checks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.checks label{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff;cursor:pointer}.actions{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}.actions-left{display:flex;gap:9px}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:11px 15px;cursor:pointer;font-weight:650}.btn.primary{background:var(--brand);color:#fff;border-color:var(--brand)}.btn.primary:hover:not(:disabled){background:var(--brand-dark)}.btn:disabled{opacity:.55;cursor:default}.status{min-height:20px;color:var(--muted);font-size:12.5px}.status.bad{color:var(--bad)}.status.good{color:var(--good)}.results{margin-top:18px}.results h2{margin:0 0 4px}.results-sub{color:var(--muted);margin:0 0 14px}.matches{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.match{border:1px solid var(--line);border-radius:14px;padding:15px;background:#fff}.match-score{font-weight:800;color:var(--good);font-size:12px;letter-spacing:.02em}.match h3{margin:5px 0 2px;font-size:15px}.match .meta{color:var(--muted);font-size:12px}.reasons{display:grid;gap:5px;margin-top:11px;font-size:12px}.reason{color:#334155}.reason:before{content:"✓";color:var(--good);font-weight:800;margin-right:6px}.result-actions{display:flex;justify-content:space-between;gap:10px;margin-top:17px}.empty{padding:20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted);background:#fafbfc}.note{margin-top:12px;padding:11px 13px;border-radius:11px;background:#f7f8fa;color:var(--muted);font-size:12px}.hidden{display:none!important}.owner-note{background:#FDF3E1;border:1px solid #EFD9B3;color:#6B4A1E;border-radius:11px;padding:11px 13px;margin-bottom:14px;font-size:12.5px}@media(max-width:760px){.hero{display:grid}.grid{grid-template-columns:1fr}.wide{grid-column:auto}.checks{grid-template-columns:1fr 1fr}.matches{grid-template-columns:1fr}.progress-card{min-width:0}.actions{align-items:stretch;flex-direction:column}.actions-left{width:100%}.actions-left .btn{flex:1}.actions>.primary{width:100%}}@media(max-width:430px){.checks{grid-template-columns:1fr}.top{padding-left:14px;padding-right:14px}.wrap{padding-left:14px;padding-right:14px}.card{padding:17px}}
</style>
</head>
<body>
<div class="top"><a class="brand" href="/ui"><svg viewBox="0 0 32 32" fill="currentColor"><path d="M16 2.5c.9 0 1.7.5 2.2 1.3l11 19.1c1.6 2.8-.4 6.3-3.6 6.3-1.4 0-2.7-.7-3.5-1.8L16 20.2l-6.1 7.2c-.8 1.1-2.1 1.8-3.5 1.8-3.2 0-5.2-3.5-3.6-6.3l11-19.1c.5-.8 1.3-1.3 2.2-1.3zm0 4.4L6.1 24.2c-.4.7.1 1.6.9 1.6.4 0 .7-.2.9-.4L16 15.8l8.1 9.6c.2.3.5.4.9.4.8 0 1.3-.9.9-1.6L16 6.9z"/></svg>staybot</a><button class="logout" id="logout">Log out</button></div>
<div class="wrap">
  <div class="hero"><div><span class="badge" id="roleBadge">Your property profile</span><h1 id="title">Tell us what you're looking for</h1><p id="subtitle">A few structured details help Staybot find better matches before the AI conversation starts.</p></div><div class="progress-card"><div class="progress-top"><span>Profile completion</span><b id="pct">0%</b></div><div class="bar"><i id="bar"></i></div></div></div>
  <div id="setupError" class="card hidden"></div>
  <form id="form" class="card" novalidate></form>
  <section id="results" class="results hidden"></section>
</div>
<script>
const $=id=>document.getElementById(id);
let account=null, profileType=null, existing=null, lastMatches=null;
const opts={
 tenant:{title:'Find Your Rental Home',badge:'Tenant / Renter',sub:'Tell us what matters for your next rental. We will use these preferences to filter real Staybot listings before opening chat.'},
 new_investor:{title:'Build Your Investment Profile',badge:'New Property Investor',sub:'Tell us how you want to invest. Matching uses your saved criteria and real listing data before the AI explains the options.'},
 existing_investor:{title:'Update Your Investment Preferences',badge:'Existing Property Investor',sub:'Your existing portfolio stays separate. These preferences describe the next investment you want to consider.'},
 owner:{title:'Tell Us About Your Property',badge:'Owner / Seller',sub:'Capture the property details once so the Staybot team and your future listing workflow can use the same structured profile.'}
};
const radio=(name,items,val='')=>`<div class="seg">${items.map(([v,l])=>`<label><input type="radio" name="${name}" value="${v}" ${val===v?'checked':''}><span>${l}</span></label>`).join('')}</div>`;
const select=(name,items,val='')=>`<select name="${name}"><option value="">Choose…</option>${items.map(([v,l])=>`<option value="${v}" ${val===v?'selected':''}>${l}</option>`).join('')}</select>`;
const input=(name,label,type='text',val='',ph='',attrs='')=>`<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(val)}" placeholder="${esc(ph)}" ${attrs}></div>`;
const textarea=(name,label,val='',ph='')=>`<div class="field wide"><label>${label}</label><textarea name="${name}" placeholder="${esc(ph)}">${esc(val)}</textarea></div>`;
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function val(k){return existing?.requirements?.[k]??''}
function checks(name,items){const a=Array.isArray(val(name))?val(name):[];return `<div class="checks">${items.map(x=>`<label><input type="checkbox" name="${name}" value="${esc(x)}" ${a.includes(x)?'checked':''}>${esc(x)}</label>`).join('')}</div>`}
function section(title,hint,body){return `<section class="section"><h2>${title}</h2><p class="hint">${hint}</p><div class="grid">${body}</div></section>`}
function render(){const o=opts[profileType]||opts.tenant;$('roleBadge').textContent=o.badge;$('title').textContent=o.title;$('subtitle').textContent=o.sub;let html='';
if(profileType==='tenant'){
 html+=section('What are you looking for?','Start with the essentials.',`<div class="field wide"><label>Looking for</label>${radio('search_intent',[['new_rental','Rent a new home'],['move_rental','Move to another rental'],['renew','Renew current rental']],val('search_intent'))}</div>`);
 html+=section('Location','Where would you like to live?',input('city_area','City / Area','text',val('city_area'),'e.g. Cary, Raleigh or Garner')+input('preferred_neighborhoods','Preferred neighborhoods','text',(val('preferred_neighborhoods')||[]).join(', '),'e.g. Downtown, West Cary'));
 html+=section('Home requirements','Choose only what matters to you.',`<div class="field"><label>Property type</label>${select('property_type',[['house','House'],['apartment','Apartment'],['condo','Condo'],['townhouse','Townhouse']],val('property_type'))}</div>`+input('bedrooms','Bedrooms','number',val('bedrooms'),'','min="0" max="50"')+input('bathrooms','Bathrooms','number',val('bathrooms'),'','min="0" max="50"'));
 html+=section('Budget & move-in','Your maximum is the main matching constraint.',input('budget_min','Minimum monthly rent','number',val('budget_min'),'e.g. 1500','min="0" step="50"')+input('budget_max','Maximum monthly rent','number',val('budget_max'),'e.g. 2500','min="0" step="50" required')+input('move_in_date','Move-in date','date',val('move_in_date'))+`<div class="field"><label>Lease duration</label>${select('lease_duration',[['6_months','6 months'],['12_months','12 months'],['18_plus','18+ months'],['flexible','Flexible']],val('lease_duration'))}</div>`);
 html+=section('Home preferences','These are used only when the listing contains the relevant data.',`<div class="field wide"><label>Furnishing</label>${radio('furnishing',[['furnished','Furnished'],['unfurnished','Unfurnished'],['either','Either']],val('furnishing'))}</div><div class="field wide"><label>Required features</label>${checks('required_features',['Parking','Pet-friendly','Accessibility features','Laundry','Pool','Garage','Garden/Yard'])}</div>${textarea('additional_requirements','Additional requirements',val('additional_requirements'),'Anything else we should know?')}`);
}else if(profileType==='new_investor'||profileType==='existing_investor'){
 const existingRole=profileType==='existing_investor';
 html+=section('Investment strategy','Your answers guide the first matching pass.',`<div class="field wide"><label>Primary investment goal</label>${radio('investment_goal',[['buy_hold','Buy & Hold'],['rental_income','Rental Income'],['fix_flip','Fix & Flip'],['appreciation','Property Appreciation'],['mixed','Mixed Strategy']],val('investment_goal'))}</div>${existingRole?`<div class="field wide"><label>What are you looking for now?</label>${checks('looking_for',['New acquisition','Portfolio expansion','Replacement property','Fix & Flip','Passive investment','Rental-income property'])}</div>`:''}`);

 if(existingRole) html+=section('Current portfolio','These fields describe what you already own; they do not change the investment matching role.',input('current_portfolio_count','Number of investment properties','number',val('current_portfolio_count'),'e.g. 4','min="0" max="10000"')+input('current_portfolio_value','Current portfolio value (optional)','number',val('current_portfolio_value'),'e.g. 1200000','min="0" step="1000"')+textarea('current_investment_properties','Current investment properties (optional)',val('current_investment_properties'),'Addresses or short descriptions, if useful.'));
 html+=section('Location & budget','Where and at what price?',input('city_area','City / Area','text',val('city_area'),'e.g. Raleigh / Cary')+input('preferred_neighborhoods','Preferred areas','text',(val('preferred_neighborhoods')||[]).join(', '),'e.g. West Cary, North Hills')+input(existingRole?'additional_budget':'budget_min','Minimum investment budget','number',val(existingRole?'additional_budget':'budget_min'),'e.g. 300000','min="0" step="5000"')+input('budget_max','Maximum investment budget','number',val('budget_max'),'e.g. 500000','min="0" step="5000"')+input('available_cash','Available cash','number',val('available_cash'),'e.g. 150000','min="0" step="5000"'));
 html+=section('Purchase & property','Only verified listing fields are used for matching.',`<div class="field"><label>Purchase method</label>${select('purchase_method',[['cash','Cash'],['financing','Financing'],['combination','Combination'],['not_decided','Not decided']],val('purchase_method'))}</div>${existingRole?`<div class="field"><label>Financing</label>${select('financing',[['cash','Cash'],['financing_available','Financing available'],['both','Both'],['need_financing','Need financing']],val('financing'))}</div>`:`<div class="field"><label>Financing status</label>${select('financing_status',[['pre_approved','Pre-approved'],['planned','Financing planned'],['not_started','Not started'],['not_required','Not required']],val('financing_status'))}</div>`}<div class="field"><label>Investment strategy</label>${select('investment_strategy',[['buy_hold','Buy & Hold'],['rental_income','Rental Income'],['fix_flip','Fix & Flip'],['appreciation','Appreciation'],['mixed','Mixed Strategy']],val('investment_strategy'))}</div><div class="field"><label>Target property type</label>${select('target_property_type',[['house','Single Family'],['condo','Condo'],['townhouse','Townhouse'],['multi_family','Multi-family'],['other','Other']],val('target_property_type'))}</div>${input('bedrooms','Bedrooms','number',val('bedrooms'),'3','min="0" max="50"')}${input('bathrooms','Bathrooms','number',val('bathrooms'),'2','min="0" max="50"')}`);
 html+=section('Investment expectations','These are preferences, not guaranteed returns.',input('target_rental_income','Minimum expected rental income','number',val('target_rental_income'),'e.g. 2500','min="0" step="50"')+input('target_roi','Target ROI / return %','number',val('target_roi'),'e.g. 8','min="0" step="0.1"')+input('hold_period','Preferred hold period','text',val('hold_period'),'e.g. 5–10 years')+input(existingRole?'purchase_timeline':'investment_timeline','Investment timeline','text',val(existingRole?'purchase_timeline':'investment_timeline'),'Immediately / 3 months / 6 months / flexible')+`<div class="field"><label>Risk preference</label>${select('risk_preference',[['conservative','Conservative'],['moderate','Moderate'],['growth','Growth-focused']],val('risk_preference'))}</div><div class="field"><label>Number of properties to consider</label>${select('properties_to_consider',[['1','1'],['2_3','2–3'],['4_5','4–5'],['open','Open to opportunities']],val('properties_to_consider'))}</div>${textarea('primary_investment_objective','Primary investment objective',val('primary_investment_objective'),'What would make this investment a success?')}`);
 if(existingRole) html+=`<div class="owner-note"><b>Already own properties?</b> Your portfolio remains in the existing Portfolio workflow. If you are also selling/listing one of your homes, use the Property Details option later to maintain a separate seller profile.</div>`;
}else{
 html+=`<div class="owner-note"><b>Owner / seller profile</b><br>This profile is kept separate from buyer/investor preferences so listing details are not mistaken for purchase criteria.</div>`;
 html+=section('Property address','Use the address you want the team to work with.',input('property_address','Property address','text',val('property_address'),'Street, city, state')+`<div class="field"><label>Property type</label>${select('property_type',[['house','House'],['apartment','Apartment'],['condo','Condo'],['townhouse','Townhouse'],['multi_family','Multi-family'],['other','Other']],val('property_type'))}</div>`+input('bedrooms','Bedrooms','number',val('bedrooms'),'3','min="0" max="50"')+input('bathrooms','Bathrooms','number',val('bathrooms'),'2','min="0" max="50"')+input('approximate_size','Approximate size','number',val('approximate_size'),'sq ft','min="0" step="1"'));
 html+=section('Occupancy & sale','Tell us what the property looks like today.',`<div class="field"><label>Current occupancy</label>${select('occupancy',[['owner_occupied','Owner occupied'],['tenant_occupied','Tenant occupied'],['vacant','Vacant']],val('occupancy'))}</div><div class="field"><label>Selling timeline</label>${select('selling_timeline',[['immediately','Immediately'],['3_months','Within 3 months'],['3_6_months','3–6 months'],['6_12_months','6–12 months'],['flexible','Flexible']],val('selling_timeline'))}</div>${input('expected_price','Expected price','number',val('expected_price'),'e.g. 525000','min="0" step="1000"')}${input('expected_price_min','Price range minimum','number',val('expected_price_min'),'Optional','min="0" step="1000"')}${input('expected_price_max','Price range maximum','number',val('expected_price_max'),'Optional','min="0" step="1000"')}<div class="field"><label>Property condition</label>${select('property_condition',[['excellent','Excellent'],['good','Good'],['some_work','Needs some work'],['major_work','Major work required']],val('property_condition'))}</div>${textarea('major_improvements','Major improvements',val('major_improvements'),'Renovations, updates or repairs worth noting.')}${textarea('current_tenant_status','Current tenant status',val('current_tenant_status'),'Lease status, tenant timing, or vacant.')}${textarea('selling_goal','Selling goal',val('selling_goal'),'What are you hoping to achieve?')}<div class="field"><label>Preferred communication</label>${radio('preferred_communication',[['email','Email'],['phone','Phone'],['whatsapp','WhatsApp']],val('preferred_communication'))}</div>`);
}
 html+=`<div class="actions"><div class="actions-left"><button class="btn" type="button" id="back">Back to Staybot</button></div><div style="flex:1"><div class="status" id="status"></div></div><button class="btn primary" type="submit" id="submit">${profileType==='owner'?'Continue With My Property':profileType==='tenant'?'Find My Properties':profileType==='new_investor'?'Find Investment Opportunities':'Find Matching Investments'}</button></div>`;
 $('form').innerHTML=html;updateCompletion();$('back').onclick=()=>location.href='/ui';
}
function collect(){const out={};new FormData($('form')).forEach((v,k)=>{if(k==='required_features'||k==='looking_for'){out[k]=out[k]||[];out[k].push(v);return} if(v!=='' )out[k]=v});['bedrooms','bathrooms','budget_min','budget_max','available_cash','target_rental_income','target_roi','additional_budget','current_portfolio_count','current_portfolio_value','expected_price','expected_price_min','expected_price_max','approximate_size'].forEach(k=>{if(k in out)out[k]=Number(out[k])});return out}
function updateCompletion(){const data=collect();const role=profileType;let keys=role==='tenant'?['city_area','property_type','bedrooms','bathrooms','budget_max','move_in_date','lease_duration','furnishing','required_features','additional_requirements']:role==='owner'?['property_address','property_type','bedrooms','bathrooms','approximate_size','occupancy','selling_timeline','expected_price','property_condition','selling_goal','preferred_communication']:['investment_goal','city_area',role==='existing_investor'?'additional_budget':'budget_max','available_cash','purchase_method',role==='existing_investor'?'financing':'financing_status','investment_strategy','target_property_type','bedrooms','bathrooms','target_roi',role==='existing_investor'?'purchase_timeline':'investment_timeline','risk_preference'];let n=keys.filter(k=>data[k]!==undefined&&data[k]!==''&&(!Array.isArray(data[k])||data[k].length)).length;let pct=Math.round(n/keys.length*100);$('pct').textContent=pct+'%';$('bar').style.width=pct+'%'}
async function load(){try{const me=await fetch('/auth/me');if(!me.ok){location.href='/login';return}account=await me.json();const q=new URLSearchParams(location.search);profileType=q.get('profile')||account.role;if(profileType==='owner'&&!['new_investor','existing_investor'].includes(account.role)){location.href='/ui';return}const res=await fetch('/auth/requirements?profile_type='+encodeURIComponent(profileType));if(!res.ok){const t=await res.json().catch(()=>({detail:'Requirements storage is not ready.'}));showSetup(t.detail||'Unable to load requirements.');return}const data=await res.json();existing=data.profile;render();}catch(e){showSetup('We could not load your saved requirements. Please try again.')}}
function showSetup(msg){$('setupError').classList.remove('hidden');$('setupError').innerHTML='<b>We could not load your requirements.</b><p style="margin:6px 0 0;color:var(--muted)">'+esc(msg)+'</p>';$('form').classList.add('hidden')}
async function save(e){e.preventDefault();const status=$('status');status.className='status';status.textContent='Saving your preferences…';$('submit').disabled=true;const body=collect();body.profile_type=profileType;try{const r=await fetch('/auth/requirements',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const data=await r.json().catch(()=>({}));if(!r.ok){throw new Error(data.detail||'We could not save your requirements right now.')}existing=data.profile;lastMatches=data.matches;status.className='status good';status.textContent=profileType==='owner'?'Saved. Opening Staybot…':'Saved. Finding properties that match your requirements…';
      // The form is the data-collection layer. Hand the verified match set to
      // the existing chatbot so it opens with real property cards already
      // rendered instead of asking the user to repeat the same requirements.
      try { sessionStorage.setItem('staybot_requirement_bootstrap', JSON.stringify({
        profile_type: profileType,
        role: account && account.role,
        profile: data.profile,
        matches: data.matches || {matches:[], total:0}
      })); } catch (_) {}
      setTimeout(()=>{ location.href='/ui'; }, 180)}catch(err){status.className='status bad';status.textContent=err.message}finally{$('submit').disabled=false}}
function renderResults(m){const el=$('results');el.classList.remove('hidden');if(profileType==='owner'){el.innerHTML='<div class="card"><h2>Property profile saved</h2><p class="results-sub">Your property details are ready for the existing owner/listing workflow.</p><div class="result-actions"><button class="btn" id="editAgain">Edit details</button><button class="btn primary" id="continue">Continue to Staybot</button></div></div>';wireResult();return}const rows=m?.matches||[];let cards=rows.map(x=>`<article class="match"><div class="match-score">${x.match_score}% ${profileType==='tenant'?'MATCH':'INVESTMENT FIT'}</div><h3>${esc(x.title)}</h3><div class="meta">${esc(x.area||x.city||x.location||'Location to confirm')} · ${esc(x.price_label||'Price on request')}</div><div class="reasons">${(x.why||[]).slice(0,5).map(r=>`<div class="reason">${esc(r)}</div>`).join('')}</div></article>`).join('');el.innerHTML=`<div class="card"><h2>${m?.total||0} matching properties</h2><p class="results-sub">Matches are selected from real property data before the AI chat begins.</p>${cards?`<div class="matches">${cards}</div>`:'<div class="empty">We could not find an exact match yet. Try widening your budget, location, property type or other preferences.</div>'}<div class="result-actions"><button class="btn" id="editAgain">Edit requirements</button><button class="btn primary" id="continue">Open Staybot Chat</button></div></div>`;wireResult()}
function wireResult(){$('continue').onclick=()=>location.href='/ui';$('editAgain').onclick=()=>{$('results').classList.add('hidden');window.scrollTo({top:0,behavior:'smooth'})}}
$('form').addEventListener('submit',save);document.addEventListener('input',e=>{if($('form')?.contains(e.target))updateCompletion()});document.addEventListener('change',e=>{if($('form')?.contains(e.target))updateCompletion()});$('logout').onclick=async()=>{try{if(window.staybotLogout)await window.staybotLogout('/login');else await fetch('/auth/logout',{method:'POST'})}finally{location.href='/login'}};
load();
</script>
</body></html>
