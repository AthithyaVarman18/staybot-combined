<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Client requirements · Staybot</title><style>body{font:14px/1.5 Inter,Arial,sans-serif;background:#f6f7f9;color:#15191e;margin:0}.wrap{max-width:1100px;margin:auto;padding:35px 20px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.head h1{margin:0;font-size:28px}.muted{color:#68707a}.toolbar{display:flex;gap:10px;margin-bottom:14px}.toolbar input{flex:1;padding:11px;border:1px solid #ddd;border-radius:9px}.btn{padding:10px 14px;border:1px solid #ddd;background:white;border-radius:9px;cursor:pointer;font-weight:600}.list{display:grid;gap:12px}.card{background:#fff;border:1px solid #e2e5e9;border-radius:14px;padding:17px}.top{display:flex;justify-content:space-between;gap:12px}.badge{font-size:11px;font-weight:800;background:#eaf0f6;color:#1b3a5c;border-radius:999px;padding:5px 9px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:13px}.fact{border:1px solid #eee;border-radius:10px;padding:10px}.fact small{display:block;color:#68707a;font-size:10px;text-transform:uppercase}.fact b{display:block;margin-top:3px;font-size:12.5px;word-break:break-word}.json{margin-top:12px;background:#f8fafc;border-radius:10px;padding:12px;white-space:pre-wrap;max-height:260px;overflow:auto;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr 1fr}.top{align-items:flex-start;flex-direction:column}}.editor{margin-bottom:16px}.editor h2{font-size:17px;margin:0 0 14px}.row{display:grid;grid-template-columns:2fr 1fr;gap:12px}.row label,.editor>label{font-weight:650;font-size:12px}.row select,.editor textarea{display:block;width:100%;margin-top:6px;border:1px solid #ddd;border-radius:9px;padding:10px;background:#fff}.editor textarea{min-height:160px;font:12px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace}.actions{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-top:12px}.btn.primary{background:#1B3A5C;color:#fff;border-color:#1B3A5C}.json pre{white-space:pre-wrap;margin:10px 0 0}@media(max-width:700px){.row{grid-template-columns:1fr}} </style></head><body><div class="wrap"><div class="head"><div><h1>Client Requirements</h1><p class="muted">Authorized staff can view, create and update structured requirement profiles without changing the customer account role.</p></div><button class="btn" id="refresh">Refresh</button></div>
<div class="editor card"><h2>Create / Update Client Requirements</h2><div class="row"><label>Client<select id="client"></select></label><label>Profile<select id="profile"><option value="tenant">Tenant</option><option value="buyer">Buyer</option><option value="new_investor">New Investor</option><option value="existing_investor">Existing Investor</option><option value="owner">Seller / Owner</option></select></label></div><label style="display:block;margin-top:12px">Structured requirements JSON<textarea id="json" spellcheck="false" placeholder='{"city_area":"Cary","budget_max":500000,"bedrooms":3}'></textarea></label><div class="actions"><span id="msg" class="muted"></span><button class="btn primary" id="save">Save client requirements</button></div></div>
<div class="toolbar"><input id="search" placeholder="Search client, email or role…"></div><div id="list" class="list">Loading…</div></div>
<script>let rows=[],clients=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function load(){const [r,c]=await Promise.all([fetch('/staff/requirements'),fetch('/staff/requirements/clients')]);const d=await r.json().catch(()=>({})),cd=await c.json().catch(()=>({}));if(!r.ok){$('list').textContent=d.detail||'Could not load client requirements.';return}rows=d.profiles||[];clients=cd.clients||[];populateClients();render()}function populateClients(){const cur=$('client').value;$('client').innerHTML='<option value="">Choose a client…</option>'+clients.map(x=>`<option value="${esc(x.id)}">${esc(x.name)} — ${esc(x.email)} (${esc(x.role)})</option>`).join('');if(cur)$('client').value=cur}async function loadSelected(){const id=$('client').value,type=$('profile').value;if(!id)return;$('msg').textContent='Loading profile…';try{const r=await fetch('/staff/requirements/'+encodeURIComponent(id));const d=await r.json();if(!r.ok)throw new Error(d.detail||'Could not load profile.');const p=(d.profiles||[]).find(x=>x.profile_type===type);$('json').value=p?JSON.stringify(p.requirements,null,2):'{}';$('msg').textContent=p?'Existing profile loaded.':'No profile yet — create one.'}catch(e){$('msg').textContent=e.message}}async function save(){const id=$('client').value,type=$('profile').value;if(!id){$('msg').textContent='Choose a client first.';return}let req;try{req=JSON.parse($('json').value||'{}')}catch(e){$('msg').textContent='Requirements JSON must be valid JSON.';return}$('save').disabled=true;$('msg').textContent='Saving…';try{const r=await fetch('/staff/requirements/'+encodeURIComponent(id),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({role:type,profile_type:type,requirements:req})});const d=await r.json();if(!r.ok)throw new Error(d.detail||'Could not save requirements.');$('msg').textContent='Saved successfully.';await load()}catch(e){$('msg').textContent=e.message}finally{$('save').disabled=false}}function render(){const q=$('search').value.toLowerCase().trim();const out=rows.filter(x=>[x.client_name,x.client_email,x.client_role,x.profile_type].join(' ').toLowerCase().includes(q)).map(x=>{const req=x.requirements||{};const facts=Object.entries(req).filter(([,v])=>v!==null&&v!==''&&(!Array.isArray(v)||v.length)).slice(0,8).map(([k,v])=>`<div class="fact"><small>${esc(k.replaceAll('_',' '))}</small><b>${esc(Array.isArray(v)?v.join(', '):v)}</b></div>`).join('');return `<article class="card"><div class="top"><div><b>${esc(x.client_name||'Client')}</b><div class="muted">${esc(x.client_email||'')} · ${esc(x.client_role||'')}</div></div><span class="badge">${esc(x.profile_type)} · ${x.completion?.percentage||0}%</span></div><div class="grid">${facts}</div><details class="json"><summary>View complete profile</summary><pre>${esc(JSON.stringify(req,null,2))}</pre></details></article>`}).join('');$('list').innerHTML=out||'<div class="card muted">No matching client requirement profiles.</div>'}$('search').addEventListener('input',render);$('refresh').onclick=load;$('client').onchange=loadSelected;$('profile').onchange=loadSelected;$('save').onclick=save;load()</script></body></html>
