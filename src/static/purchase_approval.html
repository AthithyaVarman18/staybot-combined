<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Offer summary review · Staybot</title><style>body{font-family:Inter,Arial,sans-serif;margin:0;background:#f6f8fa;color:#18212b}.wrap{max-width:760px;margin:0 auto;padding:24px}.card{background:#fff;border:1px solid #dfe4ea;border-radius:12px;padding:18px;margin-bottom:16px}.notice{background:#fff7df;border:1px solid #efd58e;padding:12px;border-radius:9px}.muted{color:#65717e}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{padding:10px 14px;border-radius:8px;border:1px solid #ccd4dc;background:#fff;font-weight:700;cursor:pointer}.primary{background:#1b3a5c;color:#fff;border-color:#1b3a5c}.danger{background:#fff0f0;color:#9b2c2c;border-color:#e6c0c0}textarea{width:100%;min-height:100px;padding:10px;border:1px solid #ccd4dc;border-radius:8px;font:inherit;box-sizing:border-box}.terms{display:grid;grid-template-columns:190px 1fr;gap:8px;font-size:14px}.terms div:nth-child(odd){color:#65717e;font-weight:700}@media(max-width:650px){.terms{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>Summary for review — not a contract</h1><p id="ref" class="muted"></p><div class="notice"><b>Important:</b> This page is for reviewing offer terms only. It is not a purchase contract, not an electronic signature, and not legal advice. The actual contract is handled through the authorized broker/attorney platform.</div></div><div class="card" id="main">Loading…</div><div class="card"><h2>Investor decision</h2><label style="display:flex;gap:8px;align-items:center;margin:10px 0"><input type="checkbox" id="reviewed"> I reviewed the summary above.</label><textarea id="note" placeholder="Optional for approval. Required when requesting changes."></textarea><div class="row" style="margin-top:12px"><button class="btn primary" id="approve">Approve summary</button><button class="btn danger" id="changes">Request changes</button><a id="pdf" class="btn" target="_blank">Open PDF</a></div><p id="msg" class="muted"></p></div></div><script>const token=location.pathname.split('/').pop();const $=id=>document.getElementById(id);function esc(v){return String(v??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}function money(v){return v==null||v===''?'—':'$'+Number(v).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}async function api(u,o){const r=await fetch(u,o);const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.detail||`Request failed (${r.status})`);return d}async function load(){const s=await api(`/purchase-approval/${token}/api/state`);$('ref').textContent=`${s.offer.reference} · ${s.property.title} · Version ${s.version.version_number}`;const t=s.version.terms;$('main').innerHTML=`<h2>Offer terms</h2><div class="terms"><div>Offer price</div><div>${money(t.price)}</div><div>Earnest money</div><div>${money(t.earnest_money)}</div><div>Due diligence fee</div><div>${money(t.due_diligence_fee)}</div><div>Due diligence end</div><div>${esc(t.due_diligence_end||'—')}</div><div>Financing deadline</div><div>${esc(t.financing_deadline||'—')}</div><div>Closing date</div><div>${esc(t.closing_date||'—')}</div><div>Offer expires</div><div>${esc(t.expires_at||'—')}</div><div>Financing contingency</div><div>${esc(t.financing_contingency||'—')}</div><div>Included</div><div>${esc(t.included||'—')}</div></div><p class="muted" style="margin-top:16px">Property: ${esc(s.property.title)}${s.property.city?` · ${esc(s.property.city)}`:''}</p>`;$('pdf').href=`/purchase-approval/${token}/api/summary.pdf`}$async=async decision=>{try{$('approve').disabled=true;$('changes').disabled=true;const r=await api(`/purchase-approval/${token}/api/decision`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({decision,reviewed_summary:$('reviewed').checked,note:$('note').value||''})});$('msg').textContent=`Decision recorded: ${r.decision?.approval?.decision||decision}. You can close this page.`}catch(e){$('msg').textContent=e.message;$('approve').disabled=false;$('changes').disabled=false}};$('approve').onclick=()=>{if(!$('reviewed').checked){$('msg').textContent='Please confirm that you reviewed the summary.';return}$async('approved')};$('changes').onclick=()=>{$async('changes_requested')};load().catch(e=>{$('main').textContent=e.message});</script></body></html>
