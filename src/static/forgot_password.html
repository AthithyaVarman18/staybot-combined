<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Forgot password · Staybot</title>
  <!-- Customer-account page (src/services/password_reset.py). Not part of the
       staff Team login: it loads no session script and never logs anyone in. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #1B3A5C;
      --brand-dark: #12283F;
      --ink: #15191E;
      --ink-2: #5A6069;
      --ink-3: #8B9199;
      --line: #E2E4E8;
      --line-strong: #CBCFD4;
      --bg: #FFFFFF;
      --bg-soft: #F6F7F9;
      --radius-lg: 16px;
      --radius-sm: 8px;
      --shadow-card: 0 2px 28px rgba(15, 23, 33, 0.07);
      --shadow-focus: 0 0 0 3px rgba(27, 58, 92, 0.14);
      --transition: 0.16s ease;
      --font-display: "Fraunces", Georgia, serif;
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--font-sans);
      font-size: 15px;
      line-height: 1.5;
      color: var(--ink);
      background: var(--bg-soft);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 32px 16px;
    }
    .logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 22px;
      color: var(--brand);
      text-decoration: none;
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 24px;
      letter-spacing: -0.3px;
    }
    .logo svg { width: 28px; height: 28px; }
    .card {
      width: 100%;
      max-width: 440px;
      background: var(--bg);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      padding: 38px 36px;
    }
    h1 {
      font-family: var(--font-display);
      font-weight: 600;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: -0.4px;
      margin-bottom: 8px;
    }
    .lead { color: var(--ink-2); margin-bottom: 24px; }
    .field-label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 8px; }
    input[type=email] {
      width: 100%;
      height: 46px;
      padding: 0 15px;
      border: 1px solid var(--line-strong);
      border-radius: var(--radius-sm);
      font: inherit;
      font-size: 15px;
      color: var(--ink);
      background: var(--bg);
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    input::placeholder { color: var(--ink-3); }
    input:focus { outline: none; border-color: var(--brand); box-shadow: var(--shadow-focus); }
    .actions { margin-top: 20px; }
    .btn {
      display: block;
      width: 100%;
      height: 50px;
      line-height: 50px;
      padding: 0 20px;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--brand);
      color: #fff;
      font: inherit;
      font-weight: 600;
      font-size: 15.5px;
      letter-spacing: 0.2px;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      transition: background var(--transition), box-shadow var(--transition);
    }
    .btn:hover:not(:disabled) { background: var(--brand-dark); box-shadow: 0 6px 18px rgba(27, 58, 92, 0.25); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .status { min-height: 20px; margin-top: 12px; font-size: 13px; font-weight: 500; }
    .status.bad { color: #B3261E; }
    .notice {
      background: #EEF6F1;
      border: 1px solid #CFE5D8;
      color: #1F5E3E;
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      margin-bottom: 22px;
      font-weight: 500;
    }
    .foot {
      text-align: center;
      margin-top: 26px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      font-size: 14px;
    }
    .foot a { color: var(--brand); font-weight: 600; text-decoration: none; }
    .foot a:hover { color: var(--brand-dark); text-decoration: underline; }
    [hidden] { display: none !important; }
    @media (max-width: 480px) {
      .card { padding: 28px 22px; }
      h1 { font-size: 24px; }
    }
  </style>
</head>
<body>
  <a class="logo" href="/portal" aria-label="Staybot home">
    <svg viewBox="0 0 32 32" fill="currentColor" aria-hidden="true">
      <path d="M16 2.5c.9 0 1.7.5 2.2 1.3l11 19.1c1.6 2.8-.4 6.3-3.6 6.3-1.4 0-2.7-.7-3.5-1.8L16 20.2l-6.1 7.2c-.8 1.1-2.1 1.8-3.5 1.8-3.2 0-5.2-3.5-3.6-6.3l11-19.1c.5-.8 1.3-1.3 2.2-1.3zm0 4.4L6.1 24.2c-.4.7.1 1.6.9 1.6.4 0 .7-.2.9-.4L16 15.8l8.1 9.6c.2.3.5.4.9.4.8 0 1.3-.9.9-1.6L16 6.9z"/>
    </svg>
    staybot
  </a>

  <main class="card">
    <h1 id="title">Forgot Password?</h1>
    <p class="lead" id="lead">Enter the email address associated with your Staybot account.</p>

    <!-- Same message whether or not the email has an account (no account enumeration). -->
    <div class="notice" id="sent" role="status" hidden>
      If an account exists for this email address, a password reset link has been sent.
    </div>

    <form id="form" novalidate>
      <label class="field-label" for="email">Email</label>
      <input type="email" id="email" name="email" autocomplete="email" maxlength="200" placeholder="you@example.com" required autofocus>
      <div class="actions">
        <button class="btn" id="submit" type="submit">Send Reset Link</button>
      </div>
      <div class="status" id="status" role="status" aria-live="polite"></div>
    </form>

    <div class="foot"><a href="/login">Back to Login</a></div>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;

    function say(text, tone) {
      const s = $("status");
      s.textContent = text || "";
      s.className = "status " + (tone || "");
    }

    $("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = $("email").value.trim();

      if (!EMAIL_RE.test(email)) {
        say("Enter a valid email address.", "bad");
        $("email").focus();
        return;
      }

      const btn = $("submit");
      btn.disabled = true;
      say("Sending…");

      try {
        const res = await fetch("/auth/forgot-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email }),
        });
        const data = await res.json().catch(() => null);
        if (!res.ok) {
          throw new Error((data && typeof data.detail === "string" && data.detail) || `Request failed (${res.status}).`);
        }
        // Show the same confirmation for every address, then swap the form for it.
        $("form").hidden = true;
        $("lead").hidden = true;
        $("title").textContent = "Check your email";
        $("sent").hidden = false;
      } catch (err) {
        say(err.message, "bad");
        btn.disabled = false;
      }
    });

    // Restored from the back/forward cache with the button still disabled.
    window.addEventListener("pageshow", (event) => {
      if (event.persisted) {
        $("submit").disabled = false;
        say("");
      }
    });
  </script>
</body>
</html>
